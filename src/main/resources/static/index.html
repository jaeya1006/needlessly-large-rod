<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8590c">
  <title>쓸데없이 큰 지출</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <button class="nav-btn" id="prev" aria-label="이전 달">‹</button>
  <h1 id="month-label"></h1>
  <button class="nav-btn" id="next" aria-label="다음 달">›</button>
</header>
<p class="notice" id="notice" role="alert" hidden></p>

<!-- 달력 -->
<main id="view-calendar" class="view">
  <section class="summary">
    <div><span>이번 달 지출</span><strong class="expense" id="sum-expense">0원</strong></div>
  </section>
  <div class="weekdays"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
  <div class="calendar" id="calendar"></div>
  <section class="day">
    <div class="day-head"><span id="day-label"></span><span class="expense" id="day-total"></span></div>
    <ul class="entries" id="day-list"></ul>
  </section>
  <button class="fab" id="add" aria-label="새로 적기">+</button>
</main>

<!-- 통계 -->
<main id="view-stats" class="view" hidden>
  <section class="card">
    <p class="stats-caption" id="stats-caption"></p>
    <p class="stats-total" id="stats-total"></p>
    <div id="stats-diff"></div>
    <div class="donut" id="donut"><div class="donut-hole"><span id="donut-label"></span><strong id="donut-name"></strong><em id="donut-pct"></em></div></div>
  </section>
  <ul class="card legend" id="legend"></ul>
</main>

<nav class="tabbar">
  <button data-view="calendar" aria-current="page"><span aria-hidden="true">📅</span>달력</button>
  <button data-view="stats"><span aria-hidden="true">📊</span>통계</button>
</nav>

<!-- 입력 시트: 1단계 금액, 2단계 분류 -->
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="새로 적기">
  <div class="step" id="step1">
    <div class="sheet-head">
      <input type="date" id="entry-date" aria-label="날짜">
      <button class="icon-btn" data-close aria-label="닫기">✕</button>
    </div>
    <label class="amount-row">
      <span aria-hidden="true">₩</span>
      <input id="entry-amount" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="금액">
    </label>
    <button class="next-btn" id="next-step">수정</button>
    <button class="delete-btn" id="delete-entry" hidden>이 내역 삭제</button>
  </div>
  <div class="step" id="step2" hidden>
    <div class="sheet-head">
      <button class="icon-btn" id="back" aria-label="뒤로">←</button>
      <strong id="step2-amount"></strong>
      <button class="icon-btn" data-close aria-label="닫기">✕</button>
    </div>
    <input id="entry-title" class="line-input" placeholder="내역 (비우면 분류 이름)" maxlength="100">
    <input id="entry-memo" class="line-input" placeholder="메모" maxlength="500">
    <p class="hint" id="cat-hint" aria-live="polite">분류를 누르면 저장돼요</p>
    <div class="cat-grid" id="cat-grid"></div>
    <p class="error" id="error" role="alert"></p>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
